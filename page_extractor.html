<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Page Extractor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- pdf-lib CDN for client-side PDF manipulation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        PDF Page Extractor
      </h1>
      <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full">100% Client-Side</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col gap-6">

    <!-- Step 1: Upload Zone -->
    <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-white rounded-xl p-8 text-center transition-all cursor-pointer shadow-sm group">
      <input type="file" id="file-input" accept="application/pdf" class="hidden" />
      <div class="flex flex-col items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:scale-110 transition-transform">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <div>
          <p class="font-medium text-slate-700">Click to upload or drag & drop a PDF file</p>
          <p class="text-xs text-slate-400 mt-1">PDF files up to 50MB</p>
        </div>
      </div>
    </div>

    <!-- Step 2: File Info & Page Selector (Hidden by default) -->
    <div id="editor-container" class="hidden flex-col gap-6">
      
      <!-- File Metadata Card -->
      <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
          </div>
          <div>
            <h2 id="file-name" class="font-semibold text-slate-800 text-sm truncate max-w-xs sm:max-w-md">filename.pdf</h2>
            <p id="file-details" class="text-xs text-slate-500">0 pages • 0 MB</p>
          </div>
        </div>
        <button id="change-file-btn" class="text-xs font-medium text-slate-500 hover:text-slate-800 underline">Change File</button>
      </div>

      <!-- Tag Input Area -->
      <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-800 mb-1">Select Pages to Extract</label>
          <p class="text-xs text-slate-500 mb-3">Type page numbers or ranges (e.g., <code class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200">1</code>, <code class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200">3</code>, <code class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200">5-8</code>) and press <kbd class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200">Enter</kbd> or <kbd class="bg-slate-100 px-1 py-0.5 rounded border border-slate-200">,</kbd></p>
        </div>

        <!-- Interactive Tag Container -->
        <div id="tag-box" class="min-h-[52px] p-2 border border-slate-300 rounded-lg flex flex-wrap items-center gap-2 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all bg-white">
          <div id="chip-list" class="flex flex-wrap items-center gap-2"></div>
          <input type="text" id="tag-input" placeholder="Add page number..." class="flex-grow min-w-[140px] text-sm outline-none bg-transparent px-2 py-1 text-slate-800 placeholder-slate-400" />
        </div>

        <!-- Quick Select Helper Buttons -->
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="text-slate-400 font-medium">Quick Select:</span>
          <button id="btn-select-all" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-medium transition-colors">All Pages</button>
          <button id="btn-select-odd" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-medium transition-colors">Odd Pages</button>
          <button id="btn-select-even" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-medium transition-colors">Even Pages</button>
          <button id="btn-clear-all" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded font-medium transition-colors ml-auto">Clear Selection</button>
        </div>
      </div>

      <!-- Submit Action -->
      <button id="download-btn" disabled class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Process & Download PDF
      </button>

    </div>

  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
    Processed locally in your browser. No files are uploaded to any server.
  </footer>

  <!-- Client JavaScript -->
  <script>
    // State
    let state = {
      pdfBuffer: null,
      fileName: '',
      totalPages: 0,
      selectedPages: new Set()
    };

    // DOM Elements
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const editorContainer = document.getElementById('editor-container');
    const fileNameEl = document.getElementById('file-name');
    const fileDetailsEl = document.getElementById('file-details');
    const changeFileBtn = document.getElementById('change-file-btn');
    const tagInput = document.getElementById('tag-input');
    const chipList = document.getElementById('chip-list');
    const tagBox = document.getElementById('tag-box');
    const downloadBtn = document.getElementById('download-btn');

    // --- File Handling & Drag/Drop ---
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-500', 'bg-indigo-50/20');
    });
    ['dragleave', 'dragend'].forEach(evt => {
      dropZone.addEventListener(evt, () => {
        dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/20');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/20');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });
    changeFileBtn.addEventListener('click', resetApp);

    async function handleFile(file) {
      if (file.type !== 'application/pdf') {
        alert('Please select a valid PDF file.');
        return;
      }

      state.fileName = file.name;
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);

      try {
        state.pdfBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(state.pdfBuffer);
        state.totalPages = pdfDoc.getPageCount();

        // Update UI
        fileNameEl.textContent = state.fileName;
        fileDetailsEl.textContent = `${state.totalPages} pages • ${sizeMB} MB`;
        dropZone.classList.add('hidden');
        editorContainer.classList.remove('hidden');
        editorContainer.classList.add('flex');
        
        // Default to selecting all pages
        selectAllPages();
      } catch (err) {
        alert('Failed to load PDF file. It may be password protected or corrupted.');
      }
    }

    function resetApp() {
      state = { pdfBuffer: null, fileName: '', totalPages: 0, selectedPages: new Set() };
      fileInput.value = '';
      tagInput.value = '';
      chipList.innerHTML = '';
      editorContainer.classList.add('hidden');
      editorContainer.classList.remove('flex');
      dropZone.classList.remove('hidden');
      updateDownloadButton();
    }

    // --- Tag/Chip System ---
    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        processInputVal(tagInput.value);
        tagInput.value = '';
      } else if (e.key === 'Backspace' && tagInput.value === '') {
        // Remove last tag on backspace
        const pagesArray = Array.from(state.selectedPages);
        if (pagesArray.length > 0) {
          removePageTag(pagesArray[pagesArray.length - 1]);
        }
      }
    });

    tagInput.addEventListener('blur', () => {
      if (tagInput.value.trim() !== '') {
        processInputVal(tagInput.value);
        tagInput.value = '';
      }
    });

    function processInputVal(val) {
      const parts = val.split(',').map(p => p.trim()).filter(Boolean);
      
      parts.forEach(part => {
        if (part.includes('-')) {
          // Parse Range e.g. "1-5"
          const [startStr, endStr] = part.split('-');
          const start = parseInt(startStr, 10);
          const end = parseInt(endStr, 10);
          if (!isNaN(start) && !isNaN(end) && start <= end) {
            for (let i = start; i <= end; i++) {
              addPageTag(i);
            }
          }
        } else {
          // Single Number
          const num = parseInt(part, 10);
          if (!isNaN(num)) addPageTag(num);
        }
      });
    }

    function addPageTag(pageNum) {
      if (pageNum >= 1 && pageNum <= state.totalPages) {
        if (!state.selectedPages.has(pageNum)) {
          state.selectedPages.add(pageNum);
          renderChips();
        }
      } else {
        // Flash border red on invalid page number
        tagBox.classList.add('border-red-500', 'ring-2', 'ring-red-100');
        setTimeout(() => tagBox.classList.remove('border-red-500', 'ring-2', 'ring-red-100'), 1000);
      }
    }

    function removePageTag(pageNum) {
      state.selectedPages.delete(pageNum);
      renderChips();
    }

    function renderChips() {
      chipList.innerHTML = '';
      // Keep sorted numerically
      const sortedPages = Array.from(state.selectedPages).sort((a, b) => a - b);

      sortedPages.forEach(pageNum => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs font-semibold animate-fade-in';
        chip.innerHTML = `
          <span>Page ${pageNum}</span>
          <button type="button" class="hover:bg-indigo-200 rounded p-0.5 transition-colors focus:outline-none" aria-label="Remove page ${pageNum}">
            <svg class="w-3 h-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        `;
        chip.querySelector('button').addEventListener('click', () => removePageTag(pageNum));
        chipList.appendChild(chip);
      });

      updateDownloadButton();
    }

    function updateDownloadButton() {
      downloadBtn.disabled = state.selectedPages.size === 0;
    }

    // --- Quick Select Controls ---
    document.getElementById('btn-select-all').addEventListener('click', selectAllPages);
    document.getElementById('btn-select-odd').addEventListener('click', () => selectFilteredPages(p => p % 2 !== 0));
    document.getElementById('btn-select-even').addEventListener('click', () => selectFilteredPages(p => p % 2 === 0));
    document.getElementById('btn-clear-all').addEventListener('click', () => {
      state.selectedPages.clear();
      renderChips();
    });

    function selectAllPages() {
      state.selectedPages.clear();
      for (let i = 1; i <= state.totalPages; i++) state.selectedPages.add(i);
      renderChips();
    }

    function selectFilteredPages(predicate) {
      state.selectedPages.clear();
      for (let i = 1; i <= state.totalPages; i++) {
        if (predicate(i)) state.selectedPages.add(i);
      }
      renderChips();
    }

    // --- PDF Processing & Download ---
    downloadBtn.addEventListener('click', async () => {
      if (state.selectedPages.size === 0) return;

      downloadBtn.disabled = true;
      downloadBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Processing PDF...
      `;

      try {
        const srcDoc = await PDFLib.PDFDocument.load(state.pdfBuffer);
        const newDoc = await PDFLib.PDFDocument.create();

        // Convert 1-based page numbers to 0-based indices
        const indicesToCopy = Array.from(state.selectedPages)
          .sort((a, b) => a - b)
          .map(pageNum => pageNum - 1);

        const copiedPages = await newDoc.copyPages(srcDoc, indicesToCopy);
        copiedPages.forEach(page => newDoc.addPage(page));

        const pdfBytes = await newDoc.save();
        
        // Trigger browser download
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = state.fileName.replace(/\.pdf$/i, '_extracted.pdf');
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (err) {
        console.error(err);
        alert('An error occurred while generating the PDF.');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Process & Download PDF
        `;
      }
    });
  </script>
</body>
</html>
