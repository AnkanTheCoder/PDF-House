<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Effects */
        body::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Subtle left border accent on hover */
        .btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-glow);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3),
                        0 0 15px rgba(56, 189, 248, 0.15);
            background: rgba(30, 41, 59, 0.9);
        }

        .btn:hover::before {
            opacity: 1;
        }

        /* Arrow icon indicator */
        .btn::after {
            content: '→';
            font-size: 1.1rem;
            color: var(--text-sub);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .btn:hover::after {
            transform: translateX(4px);
            color: var(--accent-glow);
        }
    </style>
</head>
<body>

    <header>
        <h1>PDF House</h1>
        <p class="subtitle">Select a tool to begin</p>
    </header>

    <div class="container">
        <a class="btn" href="https://ankanthecoder.github.io/PDF-House/booklet_converter.html">PDF Booklet Converter</a>
        <a class="btn" href="https://ankanthecoder.github.io/PDF-House/combiner.html">PDF File Combiner</a>
        <a class="btn" href="https://ankanthecoder.github.io/PDF-House/image_remover.html">PDF Image Remover</a>
        <a class="btn" href="https://ankanthecoder.github.io/PDF-House/page_extractor.html">PDF Page Extractor</a>
        <a class="btn" href="https://ankanthecoder.github.io/PDF-House/text_counter.html">Text Character Counter</a>
    </div>

</body>
</html>
