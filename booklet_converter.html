<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Booklet Imposition Engine</title>
  
  <!-- PDF-LIB & PDF.js CDNs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { margin-bottom: 2rem; text-align: center; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p { color: var(--text-muted); margin-top: 0.5rem; }

    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; flex: 1; }

    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    
    input[type="number"], input[type="text"], select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.6rem; border-radius: 6px; font-size: 0.9rem;
    }
    
    input:disabled, select:disabled { opacity: 0.6; cursor: not-allowed; }

    .toggle-group { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border); transition: .2s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: 8px; padding: 2rem 1rem;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .upload-zone input { display: none; }

    .btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-area { display: flex; flex-direction: column; gap: 1rem; height: 100%; }
    .preview-scroll {
      flex: 1; overflow-y: auto; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column;
      gap: 1.5rem; align-items: center; max-height: 75vh;
    }
    
    .spread-container { display: flex; flex-direction: column; align-items: center; }
    .spread-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .spread-canvas-box { border: 1px solid var(--border); background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

    .status-msg { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; }
    .preview-info { font-size: 0.85rem; color: var(--accent); text-align: center; background: rgba(59, 130, 246, 0.1); padding: 0.5rem 1rem; border-radius: 6px; width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>PDF Booklet Generator</h1>
    <p>Convert standard document PDFs into print-ready A4 2-up imposition spreads.</p>
  </header>

  <div class="grid">
    <!-- Controls Panel -->
    <div class="panel">
      <div class="form-group">
        <label>Upload Document</label>
        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('pdf-input').click()">
          <p id="file-name">Drag & drop PDF or click to browse</p>
          <input type="file" id="pdf-input" accept="application/pdf">
        </div>
      </div>

      <div class="form-group">
        <label>Target Page Size</label>
        <select disabled>
          <option selected>A4 Landscape (297 x 210 mm)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Output Filename</label>
        <input type="text" id="filename-input" value="booklet_layout.pdf" placeholder="booklet_layout.pdf">
      </div>

      <div class="form-group">
        <label>Inner Gutter Margin (mm)</label>
        <input type="number" id="inner-margin" value="0" min="0" max="50">
      </div>

      <div class="form-group">
        <label>Outer Margin (mm)</label>
        <input type="number" id="outer-margin" value="0" min="0" max="50">
      </div>

      <div class="form-group toggle-group">
        <label for="cover-toggle">Include Dedicated Cover</label>
        <label class="switch">
          <input type="checkbox" id="cover-toggle">
          <span class="slider"></span>
        </label>
      </div>

      <button id="download-btn" class="btn" disabled>Download Booklet PDF</button>
      <p id="status-text" class="status-msg"></p>
    </div>

    <!-- Preview Area -->
    <div class="panel preview-area">
      <h2 style="font-size: 1.1rem; font-weight: 600;">Layout Preview</h2>
      <div id="preview-container" class="preview-scroll">
        <p style="color: var(--text-muted); margin: auto;">Upload a PDF to view spread imposition preview.</p>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // A4 Landscape dimensions in points (72 DPI)
    const A4_WIDTH_PT = 841.89;
    const A4_HEIGHT_PT = 595.28;
    const MM_TO_PT = 2.83465;

    let sourcePdfBytes = null;
    let generatedPdfBytes = null;

    // DOM Elements
    const dropZone = document.getElementById('drop-zone');
    const pdfInput = document.getElementById('pdf-input');
    const fileNameDisplay = document.getElementById('file-name');
    const filenameInput = document.getElementById('filename-input');
    const innerMarginInput = document.getElementById('inner-margin');
    const outerMarginInput = document.getElementById('outer-margin');
    const coverToggle = document.getElementById('cover-toggle');
    const downloadBtn = document.getElementById('download-btn');
    const previewContainer = document.getElementById('preview-container');
    const statusText = document.getElementById('status-text');

    // Event Handlers
    pdfInput.addEventListener('change', handleFileSelect);
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = 'var(--border)');
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files.length) {
        pdfInput.files = e.dataTransfer.files;
        handleFileSelect();
      }
    });

    [innerMarginInput, outerMarginInput, coverToggle].forEach(input => {
      input.addEventListener('change', () => {
        if (sourcePdfBytes) processBooklet();
      });
    });

    downloadBtn.addEventListener('click', () => {
      if (!generatedPdfBytes) return;
      
      let name = filenameInput.value.trim();
      if (!name) name = 'booklet_layout.pdf';
      if (!name.toLowerCase().endsWith('.pdf')) name += '.pdf';

      const blob = new Blob([generatedPdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
    });

    async function handleFileSelect() {
      const file = pdfInput.files[0];
      if (!file || file.type !== 'application/pdf') return;
      
      fileNameDisplay.textContent = file.name;
      
      // Auto-suggest download filename based on original
      const originalName = file.name.replace(/\.pdf$/i, '');
      filenameInput.value = `${originalName}_booklet.pdf`;

      sourcePdfBytes = await file.arrayBuffer();
      processBooklet();
    }

    async function processBooklet() {
      statusText.textContent = "Processing PDF...";
      downloadBtn.disabled = true;

      try {
        const innerMarginPt = parseFloat(innerMarginInput.value || 0) * MM_TO_PT;
        const outerMarginPt = parseFloat(outerMarginInput.value || 0) * MM_TO_PT;
        const useDedicatedCover = coverToggle.checked;

        const srcDoc = await PDFLib.PDFDocument.load(sourcePdfBytes);
        const outDoc = await PDFLib.PDFDocument.create();

        let sourcePageCount = srcDoc.getPageCount();
        
        let pageSequence = [];
        for (let i = 1; i <= sourcePageCount; i++) pageSequence.push(i);

        if (useDedicatedCover) {
          pageSequence.splice(1, 0, 0);
        }

        while (pageSequence.length % 4 !== 0) {
          pageSequence.push(0);
        }

        let spreads = [];

        if (useDedicatedCover) {
          const frontCover = pageSequence.shift(); 
          const backCover = pageSequence.pop();   
          spreads.push([backCover, frontCover]);
        }

        const totalInterior = pageSequence.length;
        for (let i = 0; i < totalInterior / 2; i += 2) {
          const outerLeft = pageSequence[totalInterior - 1 - i];
          const outerRight = pageSequence[i];
          const innerLeft = pageSequence[i + 1];
          const innerRight = pageSequence[totalInterior - 2 - i];

          spreads.push([outerLeft, outerRight]);
          spreads.push([innerLeft, innerRight]);
        }

        for (let i = 0; i < spreads.length; i++) {
          const [leftIdx, rightIdx] = spreads[i];
          const outPage = outDoc.addPage([A4_WIDTH_PT, A4_HEIGHT_PT]);

          const halfWidth = A4_WIDTH_PT / 2;

          if (leftIdx !== 0) {
            const [embeddedLeft] = await outDoc.embedPdf(srcDoc, [leftIdx - 1]);
            const targetWidth = halfWidth - (innerMarginPt + outerMarginPt);
            const scale = Math.min(targetWidth / embeddedLeft.width, A4_HEIGHT_PT / embeddedLeft.height);
            
            const renderW = embeddedLeft.width * scale;
            const renderH = embeddedLeft.height * scale;
            
            const x = outerMarginPt + (targetWidth - renderW) / 2;
            const y = (A4_HEIGHT_PT - renderH) / 2;

            outPage.drawPage(embeddedLeft, { x, y, width: renderW, height: renderH });
          }

          if (rightIdx !== 0) {
            const [embeddedRight] = await outDoc.embedPdf(srcDoc, [rightIdx - 1]);
            const targetWidth = halfWidth - (innerMarginPt + outerMarginPt);
            const scale = Math.min(targetWidth / embeddedRight.width, A4_HEIGHT_PT / embeddedRight.height);
            
            const renderW = embeddedRight.width * scale;
            const renderH = embeddedRight.height * scale;

            const x = halfWidth + innerMarginPt + (targetWidth - renderW) / 2;
            const y = (A4_HEIGHT_PT - renderH) / 2;

            outPage.drawPage(embeddedRight, { x, y, width: renderW, height: renderH });
          }
        }

        generatedPdfBytes = await outDoc.save();
        statusText.textContent = "Rendering preview...";
        await renderPreviews(generatedPdfBytes);

        downloadBtn.disabled = false;
        statusText.textContent = "Booklet generated successfully.";
      } catch (err) {
        console.error(err);
        statusText.textContent = "Error generating booklet.";
      }
    }

    async function renderPreviews(pdfBytes) {
      previewContainer.innerHTML = '';
      const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
      const pdf = await loadingTask.promise;

      // Limit rendering to the first 10 pages/spreads
      const maxPagesToPreview = Math.min(pdf.numPages, 10);

      if (pdf.numPages > 10) {
        const infoMsg = document.createElement('div');
        infoMsg.className = 'preview-info';
        infoMsg.textContent = `Showing first 10 spreads of ${pdf.numPages} total. All spreads will be included in the download file.`;
        previewContainer.appendChild(infoMsg);
      }

      for (let pageNum = 1; pageNum <= maxPagesToPreview; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 0.4 }); 

        const wrapper = document.createElement('div');
        wrapper.className = 'spread-container';

        const label = document.createElement('div');
        label.className = 'spread-title';
        label.textContent = `Spread ${pageNum} of ${pdf.numPages}`;

        const canvasBox = document.createElement('div');
        canvasBox.className = 'spread-canvas-box';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        canvasBox.appendChild(canvas);
        wrapper.appendChild(label);
        wrapper.appendChild(canvasBox);
        previewContainer.appendChild(wrapper);
      }
    }
  </script>
</body>
</html>
